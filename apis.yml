name: Arcus Biosciences
description: >-
  Arcus Biosciences is a clinical-stage biopharmaceutical company focused on
  developing differentiated cancer immunotherapies, headquartered in Hayward,
  California. Its pipeline pairs multiple novel molecules across intra-tumoral
  immune pathways, including the HIF-2a inhibitor casdatifan, the CD73 inhibitor
  quemliclustat, the anti-TIGIT antibody domvanalimab, the anti-PD-1 antibody
  zimberelimab, and the CD39 inhibitor AB598. Surfaced as a portfolio company of
  GV and added to the API Evangelist network as a life-sciences company profile.
  Arcus publishes an agent-facing surface (llms.txt, an AI content map, and an
  Organization schema) but no public developer API.
